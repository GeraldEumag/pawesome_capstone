services:
  # Laravel Backend Service
  - type: web
    name: pawesome-backend
    env: php
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader && php artisan route:cache && php artisan view:cache && php artisan storage:link
    startCommand: php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://pawesome-backend.onrender.com
      - key: FRONTEND_URL
        value: https://pawesome-frontend.vercel.app
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: mysql
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: pawesome
      - key: DB_USERNAME
        value: pawesome
      - key: DB_PASSWORD
        generateValue: true
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: redis
      - key: CACHE_STORE
        value: redis
      # Only mailables use the queue; sync keeps email delivery working on the
      # free tier (no background worker service is provisioned). If you add a
      # `type: worker` service running `php artisan queue:work`, switch this
      # back to redis.
      - key: QUEUE_CONNECTION
        value: sync
      - key: REDIS_HOST
        value: redis
      - key: REDIS_PORT
        value: 6379
      - key: CORS_ALLOWED_ORIGINS
        value: https://pawesome-frontend.vercel.app
      - key: CORS_SUPPORTS_CREDENTIALS
        value: true
      - key: SANCTUM_STATEFUL_DOMAINS
        value: pawesome-frontend.vercel.app
      - key: FILESYSTEM_DISK
        value: public
      # Brevo SMTP — set MAIL_USERNAME/MAIL_PASSWORD in the Render dashboard
      # (SMTP key from Brevo → SMTP & API → SMTP). MAIL_FROM_ADDRESS must be a
      # Brevo-verified sender.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_FROM_ADDRESS
        value: kiezerherristpascua@gmail.com
      - key: MAIL_FROM_NAME
        value: Pawesome Retreat
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: error

  # MySQL Database
  - type: pserv
    name: mysql
    env: mysql
    plan: free
    databases:
      - name: pawesome
        user: pawesome
    envVars:
      - key: MYSQL_DATABASE
        value: pawesome
      - key: MYSQL_USER
        value: pawesome
      - key: MYSQL_PASSWORD
        generateValue: true

  # Redis Cache
  - type: pserv
    name: redis
    env: redis
    plan: free
    envVars:
      - key: REDIS_PASSWORD
        generateValue: true

databases:
  - name: pawesome
    databaseName: pawesome
    user: pawesome
